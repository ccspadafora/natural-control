name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nc
          POSTGRES_USER: nc
          POSTGRES_PASSWORD: nc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nc -d nc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgis://nc:nc@localhost:5432/nc
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check apps config
      - name: Migrations check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -q --cov=apps --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit || true
      - name: Unit tests
        run: pnpm --filter @nc/ui test --if-present && pnpm --filter web test --if-present && pnpm --filter campo test --if-present
