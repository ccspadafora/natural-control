[project]
name = "nc-crm"
version = "0.1.0"
description = "CRM comercial de campo de Natural Control"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.2",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<6",
  "drf-spectacular>=0.27,<0.29",
  "django-filter>=24.3",
  "psycopg[binary]>=3.2",
  "celery>=5.4,<6",
  "redis>=5.0",
  "django-celery-beat>=2.7",
  "channels>=4.1,<5",
  "channels-redis>=4.2",
  "daphne>=4.1",
  "django-storages[s3]>=1.14",
  "boto3>=1.35",
  "django-anymail[amazon-ses]>=11.0",
  "argon2-cffi>=23.1",
  "pillow>=10.4",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "structlog>=24.4",
  "gunicorn>=23.0",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "zxcvbn>=4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "django-stubs>=5.1",
  "djangorestframework-stubs>=3.15",
  "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
