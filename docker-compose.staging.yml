# Staging lean stack for t3.small (≈2 GiB RAM).
# Usage: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build

x-api: &api
  image: nc-crm-api:staging
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    target: prod
  env_file: .env.staging
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nc}
      POSTGRES_USER: ${POSTGRES_USER:-nc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nc} -d ${POSTGRES_DB:-nc}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 96m

  api:
    <<: *api
    mem_limit: 512m
    command:
      [
        "gunicorn",
        "config.asgi:application",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "-w",
        "1",
        "-b",
        "0.0.0.0:8000",
        "--timeout",
        "60",
        "--graceful-timeout",
        "30",
        "--access-logfile",
        "-",
      ]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *api
    mem_limit: 384m
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "-Q",
        "default,sync,notify,whatsapp,erp,reports,maint",
        "-c",
        "1",
        "-l",
        "info",
      ]

  beat:
    <<: *api
    mem_limit: 128m
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]

  nginx:
    image: nc-crm-nginx:staging
    build:
      context: .
      dockerfile: infra/docker/nginx.prebuilt.Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  media:
