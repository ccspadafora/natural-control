<!doctype html>
<html lang="es-CO" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#124481" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campo" />
    <link rel="icon" href="/campo/icon-192.png" />
    <link rel="apple-touch-icon" href="/campo/icon-maskable-192.png" />
    <link rel="manifest" href="/campo/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Natural Control · Campo</title>
    <style>
      #nc-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #124481;
        color: #fff;
        font-family: "Nunito Sans", system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #nc-splash[hidden] { display: none; }
      #nc-splash .nc-splash-mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: rgba(255,255,255,0.12);
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      #nc-splash p { margin: 16px 0 0; font-size: 14px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="nc-splash" aria-live="polite">
      <div style="text-align:center">
        <div class="nc-splash-mark">NC</div>
        <p>Campo</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
